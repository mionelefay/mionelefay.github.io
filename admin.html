
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#100b1d">
  <title>Painel Administrativo | Mione Le Fay</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" defer></script>
  <script src="admin.js" defer></script>

  <style>
    .admin-container {
      max-width: 480px;
      margin: 80px auto;
      padding: 32px;
      background: #211631;
      border: 1px solid #68458a;
      border-radius: 18px;
      color: #fff;
    }

    .admin-container h1 {
      margin-bottom: 12px;
      color: #e8c7ff;
    }

    .admin-container p {
      margin-bottom: 24px;
    }

    .admin-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .admin-form label {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .admin-form input {
      width: 100%;
      padding: 12px;
      border: 1px solid #7956a0;
      border-radius: 8px;
      background: #100b1d;
      color: white;
      font: inherit;
    }

    .admin-form button {
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #a66de0;
      color: #100b1d;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    .admin-form button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .admin-mensagem {
      margin-top: 18px;
    }

    .admin-mensagem[hidden] {
      display: none;
    }
  </style>
</head>

<body>
  <header class="topo">
    <a class="logo" href="index.html">✦ MIONE LE FAY</a>
    <nav aria-label="Menu principal">
      <a href="index.html">Voltar ao site</a>
    </nav>
  </header>

  <main>
    <section class="admin-container">
      <p class="destaque">ÁREA RESTRITA</p>
      <h1>🔐 Painel Administrativo</h1>
      <p>Entre com suas credenciais para gerenciar a agenda.</p>

      <form id="login-form" class="admin-form">
        <label for="admin-email">
          E-mail
          <input
            type="email"
            id="admin-email"
            autocomplete="username"
            required
          >
        </label>

        <label for="admin-senha">
          Senha
          <input
            type="password"
            id="admin-senha"
            autocomplete="current-password"
            required
          >
        </label>

        <button type="submit" id="entrar">
          Entrar no painel
        </button>
      </form>

      <p id="admin-mensagem" class="admin-mensagem"
         role="status" aria-live="polite" hidden></p>

     
<section id="area-admin" hidden>
  <h2>Bem-vinda ao painel! 💜</h2>
  <p>Cadastre e organize os eventos da sua agenda.</p>

  <h3>📅 Cadastrar novo evento</h3>

  <form id="evento-form" class="admin-form">
    <label for="evento-titulo">
      Título
      <input type="text" id="evento-titulo" required>
    </label>

    <label for="evento-categoria">
      Categoria
      <select id="evento-categoria" required>
        <option value="">Selecione uma categoria</option>
        <option value="rpg-proprio">🎲 RPG no meu canal</option>
        <option value="rpg-externo">🧙 RPG em outros canais</option>
        <option value="podcast">🎙️ Podcasts</option>
        <option value="jogos">🎮 Jogos</option>
        <option value="video">🎬 Vídeos</option>
      </select>
    </label>

    <label for="evento-data">
      Data
      <input type="date" id="evento-data" required>
    </label>

    <label for="evento-hora">
      Horário
      <input type="time" id="evento-hora" required>
    </label>

    <label for="evento-canal">
      Canal
      <input type="text" id="evento-canal">
    </label>

    <label for="evento-sinopse">
      Sinopse
      <textarea id="evento-sinopse" rows="4"></textarea>
    </label>

    <label for="evento-imagem">
      URL da imagem
      <input type="url" id="evento-imagem">
    </label>

    <label for="evento-link">
      Link da transmissão
      <input type="url" id="evento-link">
    </label>

    <label for="evento-status">
      Situação do evento
      <select id="evento-status">
        <option value="agendada">Rascunho (não publicado)</option>
        <option value="publicada">Publicado no calendário</option>
      </select>
    </label>

    <button type="submit" id="salvar-evento">
      💾 Salvar evento
    </button>
  </form>

  <p id="evento-mensagem" role="status" aria-live="polite"></p>

  <button id="sair" type="button">Sair da conta</button>
</section>

    </section>
  </main>

  <footer>
    <p>💜 Mione Le Fay • Área administrativa</p>
  </footer>
</body>
</html>
